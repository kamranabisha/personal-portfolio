<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Games</title>

<link rel="stylesheet" href="style.css">

<style>

.games-list{
padding:80px;
}

.games-list h1{
text-align:center;
margin-bottom:40px;
}

.game-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.game{
background:#161b22;
border-radius:15px;
overflow:hidden;
}

.game img{
width:100%;
height:220px;
object-fit:cover;
}

.game h3{
padding:15px;
}

.game p{
padding:0 15px 20px;
color:gray;
}

.back{
display:inline-block;
margin:30px;
padding:12px 25px;
background:#00d4ff;
color:black;
text-decoration:none;
border-radius:30px;
font-weight:bold;
}

</style>

</head>

<body>

<a href="index.html" class="back">← Back Home</a>

<section class="games-list">

<h1>Action Games</h1>

<div class="game-grid">

<div class="game">
<img src="images/image 1.png">
<h3>Cyber Battle</h3>
<p>Fast-paced FPS action game.</p>
</div>

<div class="game">
<img src="images/war.jpg">
<h3>War Strike</h3>
<p>Modern military combat.</p>
</div>

<div class="game">
<img src="images/arena.jpg">
<h3>Battle Arena</h3>
<p>Online multiplayer battles.</p>
</div>

</div>

</section>

</body>
</html>
